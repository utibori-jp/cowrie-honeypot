[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "honeypot-analytics"
version = "0.1.0"
description = "Analysis of Cowrie honeypot logs"
requires-python = ">=3.11"
dependencies = [
    "duckdb==1.5.5",
    "pandas==2.3.3",
    "pyarrow==22.0.0",
    "scikit-learn==1.9.0",
    "lifelines==0.30.3",
]

[project.optional-dependencies]
# Installed in the image so the same container backs Jupyter and the jobs.
notebook = [
    "jupyterlab==4.6.3",
    "matplotlib==3.10.7",
]
dev = [
    "pytest==9.0.1",
]

[project.scripts]
honeypot-analytics = "honeypot_analytics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
