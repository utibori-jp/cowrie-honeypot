name: analytics image

on:
  push:
    branches: [main]
    paths: ['analytics/**', '.github/workflows/analytics-image.yml']
    tags: ['analytics-v*']
  pull_request:
    paths: ['analytics/**']

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/honeypot-analytics

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - working-directory: analytics
        run: |
          pip install -e '.[dev]'
          pytest -q

  publish:
    needs: test
    # Pull requests build nothing. The cluster only ever runs tagged images.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # analytics-v0.1.0 publishes as v0.1.0; main publishes as edge.
          tags: |
            type=match,pattern=analytics-(v.*),group=1
            type=edge,branch=main
      - uses: docker/build-push-action@v6
        with:
          context: analytics
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
